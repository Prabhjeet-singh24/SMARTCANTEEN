<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Login · Smart Canteen</title>
<link rel="icon" href="assets/images/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/auth.css">
<link rel="stylesheet" href="css/responsive.css">
</head>
<body data-page="login">

<div class="auth-page">
<aside class="auth-side"><a class="brand" href="index.html"><img src="assets/images/logo.svg" alt=""><span>Smart <b>Canteen</b></span></a><h2>Hungry? Let's get you fed.</h2><p>Sign in to order, track your food in real time and see your order history.</p><div class="emoji-row" aria-hidden="true">🍛 🥟 ☕ 🍔</div></aside>
<main class="auth-main"><div class="auth-box">
  <div class="auth-top"><a class="brand" href="index.html"><img src="assets/images/logo.svg" alt=""><span>Smart <b>Canteen</b></span></a></div>
  <h1>Welcome back 👋</h1><p class="sub">Sign in to your customer account.</p>
  <form id="login-form" novalidate>
    <div class="form-alert hidden"></div>
    <div class="form-group"><label for="email">Email</label><input class="input" id="email" name="email" type="email" autocomplete="email" placeholder="you@example.com" required><div class="field-error" data-error-for="email"></div></div>
    <div class="form-group"><label for="password">Password</label><div class="pw-wrap"><input class="input" id="password" name="password" type="password" autocomplete="current-password" required><button type="button" class="pw-toggle" aria-label="Show password">👁️</button></div><div class="field-error" data-error-for="password"></div></div>
    <button class="btn btn-primary btn-block" type="submit">Sign in</button>
  </form>
  <div class="auth-links">New here? <a href="register.html">Create an account</a><br><br><a href="admin/login.html">Admin login →</a></div>
</div></main></div>
<div id="toast-root"></div>
<script src="js/config.js"></script>
<script src="js/main.js"></script>
<script src="js/auth.js"></script>
</body>
</html>
